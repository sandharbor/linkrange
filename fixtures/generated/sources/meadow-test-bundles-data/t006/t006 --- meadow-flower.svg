<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">Visible text and shape links for SVG testing</title>
  <desc id="description">An underlined text link and a separately labeled flower-shaped link.</desc>
  <rect width="640" height="400" rx="18" fill="#fffdf7"/>

  <text x="24" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#262626">Links for Testing — Text Link</text>
  <a href="./t006 --- page that embeds Excalidraw in another directory.md" aria-label="Open the page that embeds Excalidraw in another directory">
    <text x="24" y="82" font-family="sans-serif" font-size="18" fill="#d97706" text-decoration="underline">t006 --- page that embeds Excalidraw in another directory</text>
  </a>

  <text x="24" y="142" font-family="sans-serif" font-size="24" font-weight="700" fill="#262626">Links for Testing — Drawn Element</text>
  <text x="24" y="174" font-family="sans-serif" font-size="16" fill="#525252">Click the flower to open the embedded media page.</text>

  <a href="../t006 - embedded media.md" aria-label="Open the embedded media page from the flower">
    <circle cx="128" cy="282" r="30" fill="#f5c542"/>
    <circle cx="128" cy="226" r="32" fill="#e87461"/>
    <circle cx="180" cy="264" r="32" fill="#e87461"/>
    <circle cx="160" cy="326" r="32" fill="#e87461"/>
    <circle cx="96" cy="326" r="32" fill="#e87461"/>
    <circle cx="76" cy="264" r="32" fill="#e87461"/>
    <line x1="128" y1="312" x2="128" y2="372" stroke="#5a9e4b" stroke-width="4"/>
    <ellipse cx="108" cy="345" rx="20" ry="10" fill="#5a9e4b"/>
  </a>

  <line x1="320" y1="268" x2="218" y2="268" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
  <polygon points="218,268 244,250 244,286" fill="#0e7490"/>
  <text x="342" y="276" font-family="sans-serif" font-size="22" font-weight="600" fill="#0e7490">linked flower</text>
</svg>
