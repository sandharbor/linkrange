[package]
name = "linkrange"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
description = "Bounded context graphs from linked files, as a Rust library and CLI"
repository = "https://github.com/sandharbor/linkrange"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
fs2 = "0.4"
pulldown-cmark = "0.13"
html5ever = "0.40"
percent-encoding = "2.3"

[dev-dependencies]
tempfile = "3"
