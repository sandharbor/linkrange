<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">Visible links to the two native HTML pages</title>
  <desc id="description">An underlined text link to the first HTML page and a linked purple flower for the second.</desc>
  <rect width="640" height="360" rx="24" fill="#f5f3ff"/>

  <text x="24" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#262626">Links for Testing — Text Link</text>
  <a href="t026 ---- first HTML page.html" aria-label="Open the first HTML page">
    <text x="24" y="82" font-family="sans-serif" font-size="19" fill="#d97706" text-decoration="underline">t026 ---- first HTML page</text>
  </a>

  <text x="24" y="142" font-family="sans-serif" font-size="24" font-weight="700" fill="#262626">Links for Testing — Drawn Element</text>
  <text x="24" y="174" font-family="sans-serif" font-size="16" fill="#525252">Click the flower to open the second HTML page.</text>

  <a href="t026 ---- second HTML page.html" aria-label="Open the second HTML page from the flower">
    <g fill="#8b5cf6" stroke="#5b21b6" stroke-width="4">
      <circle cx="138" cy="207" r="36"/>
      <circle cx="188" cy="236" r="36"/>
      <circle cx="170" cy="310" r="36"/>
      <circle cx="106" cy="310" r="36"/>
      <circle cx="88" cy="236" r="36"/>
    </g>
    <circle cx="138" cy="265" r="31" fill="#fbbf24" stroke="#92400e" stroke-width="4"/>
  </a>

  <line x1="352" y1="264" x2="230" y2="264" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
  <polygon points="230,264 256,246 256,282" fill="#0e7490"/>
  <text x="374" y="272" font-family="sans-serif" font-size="22" font-weight="600" fill="#0e7490">linked flower</text>
</svg>
